name: C++ CI Workflow with conda dependencies

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  check-style:
    name: 'Check Style'
    runs-on: ubuntu-24.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq -y perl
    - name: Check Style
      run: |
        perl tests/misc/check_style.pl

  check-license:
    name: 'Check License'
    runs-on: ubuntu-24.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq -y perl
    - name: Check License
      run: |
        perl tests/misc/check_license.pl

  check-tests:
    name: 'Check Devices Tests'
    runs-on: ubuntu-24.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq -y python3
    - name: Check Devices Tests
      run: |
        python3 tests/misc/check_tests.py

  build-and-test:
    name: 'Build & test (Linux / Kokoro)'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - uses: conda-incubator/setup-miniconda@v2
      with:
        miniforge-variant: Mambaforge
        miniforge-version: latest

    - name: Dependencies
      shell: bash -l {0}
      run: |
        conda install cmake compilers make ninja pkg-config
        conda install -c conda-forge -c robostack-staging ycm-cmake-modules eigen ace sqlite
        python -m pip install --upgrade pip
        # Kokoro TTS (also pulls torch) is required by open()/runtime tests.
        python -m pip install kokoro

    - name: Download YARP
      run: |
        cd ${GITHUB_WORKSPACE}
        git clone https://github.com/robotology/yarp

    - name: Build & install YARP (with dev_tests)
      shell: bash -l {0}
      run: |
        cd ${GITHUB_WORKSPACE}/yarp
        mkdir build && cd build
        cmake -GNinja -DCMAKE_INSTALL_PREFIX=${CONDA_PREFIX} \
                      -DCMAKE_BUILD_TYPE=Release .. \
                      -DYARP_COMPILE_TESTS:BOOL=ON \
                      -DYARP_COMPILE_ALL_FAKE_DEVICES:BOOL=ON
        cmake --build . --config Release
        cmake --install . --config Release
        echo "YARP_DATA_DIRS=${CONDA_PREFIX}/share/yarp::${YARP_DATA_DIRS}" >> $GITHUB_ENV

    - name: Configure
      shell: bash -l {0}
      run: |
        cd ${GITHUB_WORKSPACE}
        cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
              -DYARP_COMPILE_TESTS:BOOL=ON \
              -DBUILD_KOKORO_SMOKE_TEST:BOOL=ON

    - name: Build
      shell: bash -l {0}
      run: |
        cd ${GITHUB_WORKSPACE}
        cmake --build build --config Release -j2

    - name: Run tests (Catch2 dev_test suite + Kokoro smoke test)
      shell: bash -l {0}
      run: |
        cd ${GITHUB_WORKSPACE}/build
        export YARP_DATA_DIRS=${CONDA_PREFIX}/share/yarp:$PWD/share/yarp
        export KOKORO_PYTHON=${CONDA_PREFIX}/bin/python
        export LD_LIBRARY_PATH=${CONDA_PREFIX}/lib:$PWD/lib/yarp:$PWD/lib
        ctest --output-on-failure --timeout 900
